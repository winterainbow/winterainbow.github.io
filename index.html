<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>个人主页</title>
<meta name="description" content="个人介绍与求职主页">
<link rel="stylesheet" href="style.css?v=19">
</head>
<body>

  <!-- ===== 左侧导航栏 ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand" data-field="profile.name">张振东</div>
      <div class="brand-sub" data-field="profile.headline">嵌入式软件工程师</div>
    </div>
    <nav class="sidebar-nav" id="navLinks">
      <a href="#home">🏠 首页</a>
      <a href="#about">👤 关于我</a>
      <a href="#skills">🛠 技能</a>
      <a href="#experience">💼 经历</a>
      <a href="#projects">📁 项目作品</a>
      <a href="#education">🎓 教育</a>
      <a href="#contact">✉️ 联系</a>
      <a href="#personal">🏆 荣誉奖项</a>
    </nav>
    <div class="sidebar-actions">
      <button class="btn btn-primary btn-block" data-action="resume">📄 下载简历</button>
      <button class="btn btn-ghost btn-block" id="editBtn">✏️ 编辑</button>
    </div>
  </aside>

  <button class="menu-toggle" id="menuToggle" aria-label="菜单">☰</button>
  <div class="sidebar-overlay" id="sidebarOverlay" hidden></div>

  <!-- ===== 主内容 ===== -->
  <main class="main">

    <!-- 首屏 Hero -->
    <section class="hero" id="home">
      <span class="leaf leaf-1">🍃</span>
      <span class="leaf leaf-2">🌿</span>
      <span class="leaf leaf-3">🍀</span>
      <div class="hero-inner">
        <div class="avatar-box" id="avatarBox" title="点击更换头像">
          <img id="avatarImg" alt="头像" />
          <span class="avatar-placeholder" id="avatarPlaceholder">头像</span>
        </div>
        <h1 class="hero-name" data-field="profile.name">张振东</h1>
        <div class="hero-headline" data-field="profile.headline">嵌入式软件工程师</div>
        <p class="hero-tagline" data-field="profile.tagline">22岁 · 广东技术师范大学本科 · 求职方向：电子工程师 / 嵌入式软件 / MCU 开发</p>
        <div class="hero-meta" id="heroMeta"></div>
        <div class="hero-cta">
          <button class="btn btn-primary" data-action="resume">📄 下载简历</button>
          <a class="btn btn-outline" href="#contact">✉️ 联系我</a>
        </div>
      </div>
    </section>

    <!-- 关于我 -->
    <section class="section" id="about">
      <div class="container">
        <h2 class="section-title">关于我</h2>
        <div class="card" id="aboutBox"></div>
      </div>
    </section>

    <!-- 技能 -->
    <section class="section section-alt" id="skills">
      <div class="container">
        <h2 class="section-title">专业技能</h2>
        <div class="card" id="skillsBox"></div>
      </div>
    </section>

    <!-- 工作经历 -->
    <section class="section" id="experience">
      <div class="container">
        <h2 class="section-title">工作经历</h2>
        <div class="timeline" id="experienceBox"></div>
      </div>
    </section>

    <!-- 项目作品 -->
    <section class="section section-alt" id="projects">
      <div class="container">
        <h2 class="section-title">项目作品</h2>
        <div class="projects-grid" id="projectsBox"></div>
      </div>
    </section>

    <!-- 教育 -->
    <section class="section" id="education">
      <div class="container">
        <h2 class="section-title">教育背景</h2>
        <div class="timeline" id="educationBox"></div>
      </div>
    </section>

    <!-- 联系 -->
    <section class="section section-alt" id="contact">
      <div class="container">
        <h2 class="section-title">联系方式</h2>
        <div class="contact-grid" id="contactBox"></div>
      </div>
    </section>

    <!-- 荣誉奖项 -->
    <section class="section" id="personal">
      <div class="container">
        <h2 class="section-title">荣誉奖项</h2>
        <p class="section-sub">竞赛获奖 · 资格证书</p>
        <div class="personal-grid" id="personalBox"></div>
      </div>
    </section>

    <!-- 页脚 -->
    <footer class="footer">
      <div class="container footer-inner">
        <div class="footer-left">
          <span data-field="profile.name">张振东</span> · <span data-field="profile.headline">嵌入式软件工程师</span>
        </div>
        <div class="footer-right">
          <span id="footerYear"></span>
        </div>
      </div>
    </footer>

  </main>

  <!-- ===== 编辑密码弹窗 ===== -->
  <div class="modal-mask" id="editPwdModal" hidden>
    <div class="modal">
      <button class="modal-close" data-close="editPwdModal" aria-label="关闭">×</button>
      <h3 class="modal-title">进入编辑模式</h3>
      <p class="modal-sub">请输入密码</p>
      <form id="editPwdForm" autocomplete="off">
        <label class="field">
          <span>密码</span>
          <div class="pwd-wrap">
            <input type="password" id="editPwd" placeholder="请输入密码" required>
            <button type="button" class="pwd-toggle" id="editPwdToggle" aria-label="显示/隐藏密码">👁</button>
          </div>
        </label>
        <div class="login-error" id="editPwdError"></div>
        <button type="submit" class="btn btn-primary btn-block">进入编辑</button>
      </form>
    </div>
  </div>

  <!-- ===== 编辑模式工具栏 ===== -->
  <div class="edit-toolbar" id="editToolbar" hidden>
    <div class="edit-toolbar-inner">
      <span class="edit-badge">🛠 编辑模式</span>
      <div class="edit-toolbar-actions">
        <button class="btn btn-sm btn-outline" id="previewBtn">👁 预览</button>
        <button class="btn btn-sm btn-outline" id="exportBtn">导出数据</button>
        <button class="btn btn-sm btn-outline" id="importBtn">导入数据</button>
        <input type="file" id="importFile" accept=".json" hidden>
        <button class="btn btn-sm btn-outline" id="resetBtn">恢复默认</button>
        <button class="btn btn-sm btn-ghost" id="logoutBtn">退出编辑</button>
      </div>
    </div>
  </div>

  <div class="edit-tip" id="editTip" hidden>💡 编辑模式：点击文字可直接修改，列表可删除 / 添加条目，改完点「导出数据」发给我更新线上版本</div>

  <script src="data.js?v=19"></script>
  <script src="app.js?v=19"></script>
</body>
</html>
